name: Refresh README cards
on:
  schedule: [{ cron: "30 1 * * *" }]   # every morning
  workflow_dispatch:
  push:
    paths: ["scripts/render_readme_cards.py", "fonts/**", "assets/**"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch contribution calendar
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_USER: LuckysHorizon }
        run: python scripts/fetch_contributions.py
      - name: Render README cards (hero, graph, chart, tiles, repos, stack)
        run: python scripts/render_readme_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || (git commit -m "chore: refresh README cards" && git push)
